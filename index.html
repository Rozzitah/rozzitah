<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rozzitah | Shop Everything</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#faf8f4;color:#24221f}
header{background:#fff;padding:22px 6%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee}
.logo{font-family:Georgia,serif;font-size:30px;letter-spacing:4px;color:#a47c39}
nav a{margin:0 12px;text-decoration:none;color:#333;font-size:14px}
.cart{border:1px solid #a47c39;padding:10px 18px;border-radius:25px;background:white;cursor:pointer}
.hero{padding:75px 7%;background:#eee8dc;display:flex;align-items:center;justify-content:space-between;gap:30px}
.hero h1{font-family:Georgia,serif;font-size:48px;max-width:500px;font-weight:normal}
.hero p{color:#665f55;line-height:1.8}
.hero button,.buy{background:#a47c39;color:white;border:0;padding:13px 24px;cursor:pointer;border-radius:3px}
.hero img{width:42%;max-height:330px;object-fit:cover;border-radius:5px}
.section{padding:45px 6%}
.section h2{text-align:center;font-family:Georgia,serif;font-size:32px;font-weight:normal}
.categories{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:25px 0}
.categories button{padding:11px 20px;background:white;border:1px solid #ddd;cursor:pointer}
.categories button.active{background:#a47c39;color:white}
.search{display:block;width:100%;max-width:500px;margin:20px auto;padding:14px;border:1px solid #ddd;border-radius:3px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:25px}
.card{background:white;padding-bottom:18px;text-align:center;border:1px solid #eee}
.card img{width:100%;height:220px;object-fit:cover}
.card h3{font-family:Georgia,serif;font-weight:normal}
.price{color:#a47c39;font-weight:bold}
.buy{margin-top:8px}
footer{background:#24221f;color:white;text-align:center;padding:35px}
@media(max-width:650px){
header{padding:18px 4%;flex-wrap:wrap;gap:15px}
nav{width:100%;display:flex;flex-wrap:wrap;gap:8px}
nav a{margin:0 5px}
.hero{padding:40px 6%;flex-direction:column}
.hero h1{font-size:36px}
.hero img{width:100%}
}
</style>
</head>

<body>

<header>
<div class="logo">ROZZITAH</div>
<nav>
<a href="#">Home</a>
<a href="#products">Shop</a>
<a href="#categories">Categories</a>
</nav>
<button class="cart" onclick="showCart()">Cart (<span id="count">0</span>)</button>
</header>

<section class="hero">
<div>
<p>WELCOME TO ROZZITAH</p>
<h1>Discover Your Style. Shop Your World.</h1>
<p>Everyday essentials and luxury finds, all in one place.</p>
<button onclick="document.getElementById('products').scrollIntoView()">SHOP NOW</button>
</div>
<img src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=800" alt="Fashion store">
</section>

<section class="section" id="products">
<h2>Explore Our Collection</h2>

<input class="search" id="search" placeholder="Search for products..." oninput="renderProducts()">

<div class="categories" id="categories">
<button class="active" onclick="filter('All',this)">All</button>
<button onclick="filter('Fashion',this)">Fashion</button>
<button onclick="filter('Electronics',this)">Electronics</button>
<button onclick="filter('Beauty',this)">Beauty</button>
<button onclick="filter('Shoes',this)">Shoes</button>
<button onclick="filter('Home',this)">Home</button>
</div>

<div class="products" id="product-list"></div>
</section>

<footer>
<h2>ROZZITAH</h2>
<p>Affordable Living. Elegant Shopping.</p>
<p>© 2026 Rozzitah Shop. All Rights Reserved.</p>
</footer>

<script>
const products=[
{id:1,name:"Elegant Handbag",price:2500,category:"Fashion",image:"https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=500"},
{id:2,name:"Wireless Headphones",price:3500,category:"Electronics",image:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500"},
{id:3,name:"Luxury Wristwatch",price:4500,category:"Fashion",image:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500"},
{id:4,name:"Running Sneakers",price:3200,category:"Shoes",image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"},
{id:5,name:"Beauty Skincare",price:1800,category:"Beauty",image:"https://images.unsplash.com/photo-1608248543803-ba4f8c70ae0b?w=500"},
{id:6,name:"Modern Home Decor",price:2200,category:"Home",image:"https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?w=500"},
{id:7,name:"Smart Watch",price:5500,category:"Electronics",image:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500"},
{id:8,name:"Classic Shoes",price:2800,category:"Shoes",image:"https://images.unsplash.com/photo-1543163521-1bf539c55dd2?w=500"}
];

let cart=[];
let selected="All";

function renderProducts(){
const search=document.getElementById("search").value.toLowerCase();
const filtered=products.filter(p=>
(selected==="All"||p.category===selected)&&
p.name.toLowerCase().includes(search)
);
document.getElementById("product-list").innerHTML=filtered.map(p=>`
<div class="card">
<img src="${p.image}" alt="${p.name}">
<h3>${p.name}</h3>
<p class="price">KSh ${p.price.toLocaleString()}</p>
<button class="buy" onclick="addToCart(${p.id})">ADD TO CART</button>
</div>`).join("");
}

function filter(category,button){
selected=category;
document.querySelectorAll(".categories button").forEach(b=>b.classList.remove("active"));
button.classList.add("active");
renderProducts();
}

function addToCart(id){
cart.push(products.find(p=>p.id===id));
document.getElementById("count").innerText=cart.length;
alert("Product added to your cart!");
}

function showCart(){
if(cart.length===0){
alert("Your shopping cart is empty.");
return;
}
let total=cart.reduce((sum,p)=>sum+p.price,0);
let items=cart.map(p=>p.name+" - KSh "+p.price.toLocaleString()).join("\n");
alert("YOUR ROZZITAH CART\n\n"+items+"\n\nTotal: KSh "+total.toLocaleString());
}

renderProducts();
</script>

</body>
</html>
