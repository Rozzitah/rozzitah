<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rozzitah Shop</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f9; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ccc; padding-bottom: 10px; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
    .product-card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
    .product-card button { background: #0070f3; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
    .product-card button:hover { background: #0051a2; }
  </style>
</head>
<body>

  <header>
    <h1>Rozzitah Shop</h1>
    <div>Cart Items: <span id="cart-count">0</span></div>
  </header>

  <main>
    <h2>Products</h2>
    <div class="product-grid" id="product-list">
      <!-- Products will display here -->
    </div>
  </main>

  <script>
    const products = [
      { id: 1, name: "Wireless Headphones", price: "$99" },
      { id: 2, name: "Smart Watch", price: "$149" },
      { id: 3, name: "Running Shoes", price: "$79" }
    ];

    let cartCount = 0;

    function renderProducts() {
      const container = document.getElementById('product-list');
      container.innerHTML = products.map(p => `
        <div class="product-card">
          <h3>${p.name}</h3>
          <p>${p.price}</p>
          <button onclick="addToCart()">Add to Cart</button>
        </div>
      `).join('');
    }

    function addToCart() {
      cartCount++;
      document.getElementById('cart-count').innerText = cartCount;
    }

    renderProducts();
  </script>
</body>
</html>
